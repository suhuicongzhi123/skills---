# 规则 IR（口径、规则与校验基线的单一事实源）
#
# 定位：本文件是**口径与规则约束的机器可读事实源**，不是给 AI 读的散文。
#       散文解释仍在 core/ topics/ types/ genre/ 各文件；本文件只存「可判定的那部分」，
#       并由 scripts/compile_rules.py 做编译期一致性检查。
# 权威关系：本文件的 enumerations / invariants / gate_ids 是**编译期校验基准**；
#       写作时的解释与示例仍以各专项文件为准。两者冲突时，以 scripts/compile_rules.py
#       的编译结果为准暴露冲突，由维护者改齐，**不得靠 AI 临场仲裁**。
# 更新纪律：改任何枚举、编号、边界值，先改本文件 → 跑 compile_rules.py → 再改下游文件。
#       本文件不参与 RAG / 语义检索（见 rules/hard-layer.md 与 PLATFORM-CN.md）。
# scope 约定：query_rules.py 的 matches() **只消费 scope**（dict，省略某维＝全适用）；
#       R-006/R-012/R-017 的 scope_key 是**预留维度标注**，当前不参与过滤，
#       ❌ 不得据它推断「已支持按该维展开」（见 core/workflow.md 第 8 节）。

schema_version: 1
skill_version: 10.1.0

# ── 校验基线（单一事实源）──────────────────────────
# gatecheck.py 改动后执行 `python scripts/selfcheck.py --update-baseline` 重算并回写；
# 自检读取本值，❌ 不在 selfcheck.py 再存一份常量（双副本漂移是历史故障源）。
# 口径：sha256(CRLF→LF 归一后的文件字节)[:16]。
script_baselines:
  gatecheck_py: 53d6b0971a713d10

# ── 一、枚举（唯一定义；下游文件不得另立取值）──────────────────
enumerations:
  题材大类: [现实向, 幻想向, 末世生存, 古装向]     # 与 core/character-setup.md 账本字段权威定义逐字一致
  冲突强度档: [烈, 高, 中, 低]                     # 默认 中
  截肢时长档位: [先天档, 近期档, 多年档]           # 一律中文带「档」，禁用字母
  亲密尺度档: [A 含蓄, B 情色（半程）, C 成人（全程）]  # 默认 A；B/C 须用户显式确认
  工作流模式: [flash, pro, max]                    # 全书锁定
  审查深度: [全审, 简审]                           # 简审有禁区，见 core/workflow.md
  篇幅档: [单章, 短篇, 中篇, 长篇, 长篇·超长]
  辅具四类: [腋拐, 肘拐(前臂拐), 平台拐, 假肢]     # 及其组合；「无」＝单腿跳；轮椅是双侧截肢唯一例外
  侧别: [左, 右, 双]
  受限识别层: [核心受限, 弱受限, 点缀]
  受限让路补位层: [受限在场, 受限余波]             # 不占配额；与识别层合称「五层」
  招牌元素: [①残肢/剩余部分细节, ②颤动, ③幻肢感, ④空, ⑤辅助器具特写, ⑥被看见, ⑦亲密中的身体]
  触发型元素: [①残肢/剩余部分细节, ②颤动]          # 无契机不硬写、豁免限频
  常规型元素: [③幻肢感, ④空, ⑤辅助器具特写, ⑥被看见, ⑦亲密中的身体]
  资源账物资: [水, 食物, 药, 燃料, 子弹, 电池]     # 与 genre/postapocalyptic.md 逐字一致
  硬闸自查项: [成年, 恢复期]                       # gatecheck [15] 读取字段；成年＝性内容角色 ≥18，恢复期＝术后伤口未愈禁性爱/束缚/疼痛玩法
  交付闸机检编号: ['[15]', '[16]', '[17]', '[30]', '[31]']  # [15] 硬闸 / [16] 资源账 / [17] 章循环状态机 / [30] 幻想向真打 / [31] 默认性格与题材分割
  # 题材别名：历史/自然语言写法 → 唯一枚举值；query_rules.py 匹配前归一化，
  # 防止账本、genre 文件、口语简称与 IR 枚举漂移导致专属规则漏展开（第三轮冷读实证）。
  题材别名:
    末世: 末世生存
    末世向: 末世生存
    末世·丧尸·生存: 末世生存
    末世/丧尸/生存: 末世生存

# ── 二、跨字段不变量（编译期可判）────────────────────────────
invariants:
  - id: INV-01
    assertion: 亲密尺度档为 B 或 C 时，硬闸自查项（成年/恢复期）须齐备且实判为「通过」
    enforced_by: gatecheck [15]
    scope: 所有题材、所有模式
  - id: INV-02
    assertion: 成年闸与恢复期物理红线不因题材、世界观、用户指令关闭
    refs: SKILL.md 三 严重错误分级
    severity: hard
  - id: INV-03
    assertion: 资源账.启用 为「是」时，上次记账章与日志最大章号差 >= 3 即不得交付
    enforced_by: gatecheck [16]
    boundary_note: 规则文字「连续 3 章未记账」＝代码 `>= 3`；❌ 不得写成 `> 3`（差一档）
    scope: 末世生存
  - id: INV-04
    assertion: 时长档位只用中文；A/B/C 专指亲密尺度档
    severity: hard
  - id: INV-05
    assertion: 常规型元素限频＝两次出现之间至少隔 1 章（第 N 章后最早 N+2 章再现）；
               ③幻肢感豁免本限频，频率只由 topics/timeline.md 幻肢档位总表决定
    severity: hard
  - id: INV-06
    assertion: 受限层级共五层＝识别层三项＋让路补位层两项；「供给三层」是配额切面，不是识别层
    severity: hard
  - id: INV-07
    assertion: 示范节清单为三处，唯一清单在 core/audience.md#四道闸门
    severity: hard
  - id: INV-08
    assertion: 冷读 22 维定义保留、必判 13 维（1,2,3,5,6,9,10,13,15,16,17,21,22）＋读感七问；
               章末自查 S01–S49 编号保留、报告按 G01–G12 十二组汇总；三处计数不得漂移
               （templates/chapter.md ＆ core/cold-review.md ＆ scripts/gatecheck.py）
    severity: hard
  - id: INV-09
    assertion: 交付闸脚本 gatecheck.py 的 sha256(CRLF→LF) 前 16 位须等于 rules.yaml script_baselines.gatecheck_py
    enforced_by: selfcheck [5]
    severity: hard
  - id: INV-10
    assertion: 新增题材包时，须在 genre/ 补该题材文件、并在本文件补一条带 scope.题材大类 的专属规则
               （现有六条：R-013 末世 / R-014、R-032、R-033 幻想向 / R-015 古装 / R-016 现实向），
               否则 query_rules.py 展开该题材时无专属规则可命中
    severity: soft

# ── 三、规则（按 scope 展开；供 scripts/query_rules.py 消费）────
# scope 字段取值来自 enumerations；省略某维＝该维全适用。
# layer: hard=硬约束常驻（不参与检索） / standard=按 scope 展开 / soft=体检提示
rules:
  - id: R-001
    layer: hard
    title: 成年闸与恢复期红线
    assertion: 成年 ≥18（性内容角色全成年，未成年第三方不得目睹/卷入）；
               恢复期物理红线＝术后伤口未愈禁性爱/束缚/疼痛玩法（恢复时间线见 topics/timeline.md）；
               B/C 档逐条回填硬闸自查（成年/恢复期）。同意结构/事后护理为 SM 工艺标准（soft），非交付硬闸
    source: rules/hard-layer.md
    severity: hard
  - id: R-002
    layer: hard
    title: 回避清单
    assertion: 健腿劳损（不渲染健侧劳损苦难）；器具损耗与更换见 R-003；受伤本身不回避，写功能影响。
               其余身体/心理/黑暗题材（幻肢痛/伤口处理/苦难/猎奇/励志/补偿叙事等）按 hard-layer §二 与专项文件，均为合法题材、不作回避
    source: core/audience.md
    severity: hard
  - id: R-003
    layer: hard
    title: 器具损耗与更换禁令
    assertion: 拐头·杖尖磨损、换新、送修、备用及相关台词，命中即改（不是限频）
    source: core/audience.md
    severity: hard
  - id: R-004
    layer: hard
    title: 类型生理红线
    assertion: 按 types/{type}.md 摘本类型禁止项与可做项；❌ 不跨类型套用
    source: types/{type}.md
    severity: hard
    scope_note: 动态填充，不在本文件写死生理内容（生理事实的唯一权威仍是 types/ 各文件）
  - id: R-005
    layer: hard
    title: 辅具四类限定
    assertion: 辅具仅腋拐/肘拐(前臂拐)/平台拐/假肢及组合；轮椅仅双侧截肢例外
    source: SKILL.md
    severity: hard
  - id: R-006
    layer: standard
    title: 限频与契机
    assertion: 常规型至少隔 1 章；触发型①②无契机不硬写；③幻肢感豁免限频
    source: core/audience.md
    severity: hard
    scope_key: 招牌元素
  - id: R-007
    layer: standard
    title: 跨障分级
    assertion: 低矮障碍可单腿一跃而过；膝盖以上高度或落点须精准的障碍须绕
    source: topics/mobility-modes.md
    severity: hard
    note: ❌ 已废止「凡需抬腿越过的都过不去」的绝对化口径
  - id: R-008
    layer: standard
    title: 站定稳·位移弱
    assertion: 稳的是单脚＋第二支点三角支撑；截断整腿后重心上移偏健侧，❌ 不写「重心低」
    source: topics/mobility-modes.md
    severity: hard
  - id: R-009
    layer: standard
    title: 承重部位
    assertion: 体重压手柄、腋托只轻触定位；疲劳顺序是手掌/虎口先，其次健腿
    source: topics/daily-scenes.md
    severity: hard
  - id: R-010
    layer: standard
    title: 受限归因
    assertion: 环境只放大难度、不作受限来源；体力代价归弱受限层，不当成因、不占核心配额
    source: topics/limitation-scenes.md
    severity: hard
  - id: R-011
    layer: standard
    title: 受限五层与让路
    assertion: 识别层三项＋补位层两项；让路须登记且补法不为「无」；破窗＝窗口内核心全 0 且无在场/余波
    source: core/chapter-planning.md
    severity: hard
  - id: R-012
    layer: standard
    title: 开篇留存窗口
    assertion: 前 3 章张力级 ≥3、不得回落至 1、每章强钩 H；低冲突档或温馨日常放宽至 ≥2（两条不豁免）
    source: core/opening.md
    severity: hard
    scope_key: 冲突强度档
  - id: R-013
    layer: standard
    title: 资源账
    assertion: 每场危机须消耗或获得至少一项并推进上次记账章；连续 3 章未推进＝经济系统失效
    source: genre/postapocalyptic.md
    severity: hard
    scope:
      题材大类: [末世生存]
    enforced_by: gatecheck [16]
  - id: R-014
    layer: standard
    title: 特殊移动登记
    assertion: 特殊移动须登记形态/代价/失效/当前可用；落地回落辅具四类；不得代偿掉身体事实
    source: genre/fantasy.md
    source_note: 登记规则见 genre/fantasy.md（该处用「能力形态/代价/限制条件」措辞）；
                 assertion 里的「形态/代价/失效/当前可用」是 templates/state-ledger.yaml 特殊移动块的字段名
    severity: hard
    scope:
      题材大类: [幻想向]
  - id: R-015
    layer: standard
    title: 古装未成年防线
    assertion: 及笄/弱冠不等于成年线；议亲/婚配/过夜/侍妾场次须写明具体岁数 ≥18，未写明不得排 B/C
    source: genre/historical.md
    severity: hard
    scope:
      题材大类: [古装向]
  - id: R-016
    layer: standard
    title: 现实向题材红线
    assertion: 器具、动作、身体细节严格符合现实截肢事实；无高科技/魔法元素；
               两条题材红线＝不写超自然（出现任何即非现实向）、不写治愈（截肢不可逆）；
               日常质感优先，不写成不便清单；制度与流程是天然冲突源，但受限来源恒为身体结构、不写环境控诉；
               **零豁免**：无主角光环、无能力强化补偿、无 E1–E3 战斗豁免、无受限豁免（R-032 不适用）；
               冲突可为非战斗冲突（制度/流程/口角），R-033 不适用
    source: genre/realistic.md
    severity: hard
    scope:
      题材大类: [现实向]
    source_note: 尺度档默认 A 见 core/character-setup.md 收集流程第 11 题「亲密尺度档」；目击者只写成年见 topics/intimacy-genre.md（硬闸延伸，见 rules/hard-layer.md）；
                 标签锁定见 topics/clothing.md#六、标签锁定（跨题材通用，非现实向专属）
  - id: R-017
    layer: standard
    title: 亲密尺度分档
    assertion: A 含蓄默认；B 情色（半程）与 C 成人（全程）须显式确认；B/C 走 gatecheck [15]
    source: topics/intimacy.md
    severity: hard
    scope_key: 亲密尺度档
  - id: R-018
    layer: standard
    title: 示范句非同源
    assertion: 章末心动句与三处示范节清单按落点意象加权比对——落点同族/同义＝复写必改；
               三项全同或落点同族＋载体/动作任一相同＝复写必改；载体＋动作相同但落点意义全新＝合法变奏，
               须在 examples_used 登记「换写」及新落点意义
    source: core/audience.md
    severity: hard
  - id: R-019
    layer: standard
    title: 章循环手续
    assertion: 章末自查 → 冷读稽查(pro/max) → 修正 → 更新账本 → gatecheck PASS → 才交付
    source: core/workflow.md
    severity: hard
    enforced_by: gatecheck [17]
  - id: R-020
    layer: soft
    title: 素材面健康度
    assertion: 任意连续 8 章常规型覆盖 <4 类时提示检查契机标注；体检提示，不是补写凑数
    source: core/audience.md
    severity: soft
  - id: R-021
    layer: soft
    title: 功能配比与基调漂移
    assertion: 章节功能配比每 10 章窗口偏离基准 ≥2 章触发调整（前/后各 5 章分别校验）；
               本章须在基调核心循环内（严重错误第 4 类）
    source: core/chapter-planning.md
    severity: soft
    source_note: 基调漂移的检测判据与稽查挂在 core/cold-review.md 维度 20（对照 templates/outline.md#★主题材契约）
  - id: R-022
    layer: soft
    title: 去 AI 化
    assertion: 无套话词、无升华尾、无连续 3 段以上等长段；叙述层破折号 0、解释性冒号 0、翻案句 0（对话内不受限）；
               并覆盖 core/style.md#★AI 高频句式家族 六族（泛化顿悟 / 时间命运金句 /
               定义式反转 / 得失对仗宣言 / 空泛并列感悟 / 万能沉默占位）；
               ⚠ 合法边界优先——带具体缘由的人物判断、真实对话、情绪留白不受限；
               并覆盖 core/style.md#★伪活性判定（改写产物不得成为新模板）
    source: core/style.md
    severity: soft
  - id: R-023
    layer: standard
    title: 人物活性
    assertion: 每章至少 1 处**可验证的立场**（遮住对话标签仍认得出声口 / 台词在得到·隐藏·
               改变关系平衡 / 有代价且最违背自我形象的选择 / 每个给镜头的人答得出此刻在争取什么）；
               潜台词最上一层交给读者，❌ 不写「她记着」「这说明」类点破与括号技法自评；
               **去AI化 ≠ 去人性化，也 ≠ 去台词**；上下文已成立时允许直写情绪；
               ❌ 不以精巧小动作 + 注解代替立场（见 core/style.md#★伪活性判定）
    source: core/style.md
    source_note: >-
      权威节见 core/style.md#★人物活性；反向判据见同文件 #★伪活性判定；
      配套 core/character-setup.md#★性格生成轴、core/audience.md 的「★目光的分层」段；
      账本字段见 templates/state-ledger.yaml 角色固定属性.人物活性锚
    severity: soft
  - id: R-024
    layer: standard
    title: 成文工艺（章节因果链 / 叙事距离 / 氛围 / 跨章文风一致性）
    assertion: 写作时点只带三条正向目标（她要什么／什么在挡／什么出人意料），审计移到润色结构遍；
               每章填场景—续篇链（目标→灾难四型→决定→下一场目标），场间只允许「因此／但是」；
               按文风契约标叙事距离档，环境细节经注意力过滤；
               结构遍过权重审计、链压缩与受限戏剧宿主；声音遍过叙述层声口与结构层八族；
               文风指纹与意象母题逐章登记并比对近 5 章
    source: core/prose-craft.md
    source_note: >-
      权威节见 core/prose-craft.md 一～六节（1.6 链压缩／3.2 叙述层声口／5.1 八族／5.6 权重审计）；
      与 core/style.md 的分工（词句层 vs 成文层）见 SKILL.md 拆分原理第 9 条；
      落点＝S01/S02/S04/S28/S29/S41/S46 与冷读维度 10/15/16/17/20/22，
      ❌ 不新增 S 编号与冷读维度编号；示范节清单三处不变；
      示范句落点加权见 R-018；短篇缩放唯一页 core/short-form.md
    severity: soft

  - id: R-025
    layer: standard
    title: 人物声音
    assertion: 主要角色须填声音卡五项（句长／用词域／回避方式／玩笑方式／不肯承认的事）；
               每章过三问：盖名认人、温度切换一处、最紧张处台词变短；
               ❌ 不以口癖、方言尾音、网络梗代替声口；幽默不拿疼痛与伤口开玩笑
    source: core/voice.md
    severity: soft
  - id: R-026
    layer: standard
    title: 场景引擎
    assertion: 每场答得出五件事（要什么／谁在挡／试了什么／付了什么／什么变了）；
               一场靠三件具体东西站住（物／数／原话或后果）；每章至少一段概述；
               入场晚退场早；流水账四型按「加阻力不形容词」修；
               五件事是「答得出」不是「写得全」——至少省一件
    source: core/scene-engine.md
    severity: soft
  - id: R-027
    layer: standard
    title: 强度层
    assertion: 每章有且只有一个峰值段（占 15–25%，位置 65–85%，允许长句／失控／不体面）；
               每章至少一处「不管克制」（失态／粗糙），不得用形容词堆砌代替音量；
               战斗按回合计不按场计（张力 5 需 5–6 回合、4 需 3–4、3 可 1–2），
               严格按选定强度执行（冲突强度档与张力级取较严者，禁降档／降回合数）；
               幻想向战斗真打规格与两条禁令另见 R-033，
               每回合四拍（距离／交锋／结果／重置），交手段每 100 字 ≥2 个可辨识动作，
               每回合她须付出代价，且输出须留可观察后果；
               每段对话两人在争同一样东西（信息／面子／决定权／时间），纯信息句不超过一半；
               段落组织（口径均为「叙述段」＝不含对白引号的段）：碎片化率 ≤50%（对白占比 >35% 的对话章放宽到 65%）、
               连续不超过 3 段 ≤20 字、每章至少 3 段 ≥80 字；
               对白段不设长度下限，但连续纯对白不超过 6 段
    source: core/intensity.md
    severity: soft
  - id: R-028
    layer: standard
    title: 情感层
    assertion: 克制的角色与「没写感情」须分开（读者能说出她想做但没做的那件事＝压着，说不出＝不在乎）；
               情感三层：在乎的对象（不是目标）／压着的动作（想做什么没做）／漏出来的一处（全章一处）；
               五种合法呈现：身体先于判断／对物的态度／多余的动作／说一句不该说的话／注意力的偏移；
               禁三种伪情感：形容词直给／点破／代人抒情；
               冷角色靠「多做·多停·多看一眼」；
               每章三问：她在乎什么／她为它做了什么／读者能否说出她此刻最想要什么
    source: core/emotion.md
    severity: soft
  - id: R-029
    layer: standard
    title: 场景驱动器（治「全绿但没戏」）
    assertion: 一场戏三条件必需：她要的东西可能失败、她的动手没有完全成功、她付出可数的东西；
               「做事」（搬／走／整理／等，失败也不会怎样）不构成戏，只有「动手」才算；
               警戒假戏六型：跟着走／看着／数着／照做／等着／记着（有质感但没使劲）；
               详略差：正事件（动手并失败的那一次）须占全章 ≥40%，其余事件每件 ≤10%，
               全章篇幅第一名必须是正事件，若是搬东西／走路／收拾／等待＝权重错，重排不改句子；
               配角进场前须能答「他今天本来想干什么」且与她的目标冲突，否则配角只有功能没有嘴；
               每章至少三处「她不在状态」（多余的一步／顺序错乱／中途停住／话没说完／做完发现没必要）；
               情感是详略差的副产品，平均用力＝谁也不爱
    source: core/scene-drive.md
    severity: soft
    note: 「四行硬项」由 gatecheck [27] 硬检（写作卡未答即 FAIL）；本层是正向强制项，
          前几层全是否定式约束——否定式约束加得越多，删减越多，稿子越像说明书
  - id: R-030
    layer: standard
    title: 情绪信号层（治「面瘫」与「套路表情」）
    assertion: 三层信号可信度递减——语言层（句子变短／重复／停顿／改口／废话／答非所问）
              ＞身体层（呼吸／手的位置／肩膀／重心／与物件互动）＞面部层（眼／眉／嘴）；
              能写「他说不出来」就不写「他脸上露出为难的神色」；
              核心判据＝「这个词是结论还是画」：冷哼／嗤笑／眸光／嘴角勾起是结论，读者只能接受；
              「他从鼻子里出了一口气，没接话」是画，读者自己下结论；
              每个有名字的角色定 1–2 个签名情绪动作，只给一个人，只在情绪变化时出现，且要能变形
              （做不完整的那一次比做完整的一百次都重）；
              通用信号（叹气／皱眉／咬牙／攥拳／苦笑）全书每种 ≤3 次；面部特写每章 ≤2 处；
              同一场戏里三个人的情绪反应必须分三种，盖住名字能认出谁是谁
    source: core/emotion-signal.md
    severity: soft
    note: 套话词表由 gatecheck [29] 硬扫（WARN，只扫叙述层——对话里人物说「哼」是合法台词）；
          依据：中文网文有专门帖问「除了冷哼一声还能怎么写」，回帖给的全是同义词（换汤不换药）；
          英文写作圈建议通用动作（叹气／翻白眼／皱眉／咬牙）整本小说不超过三次
  - id: R-031
    layer: standard
    title: 局部编辑纪律（治「改一处坏两处」）
    assertion: 改任何一处之前读**前后各 3 段**（这句话依赖什么／谁依赖这句话）；
              改完**立刻回读**，查四种联动——引子（前文铺垫是否落空）／承接（后文口径是否对得上）／
              配对（一问一答是否还成对）／持有（她手里的东西是否还在）；
              **一次只改一处**，改完回读再改下一处，❌ 不批量替换；
              判据：把改动处的前一段和后一段连起来读，读不通＝断了，读得通但意思变了＝改过头
    source: core/prose-craft.md#5.5、局部编辑纪律
    severity: soft
    note: 立条原因是一章之内连犯三次——删掉引子致下文悬空、替换时吞掉紧跟的台词、
          改标题时忘同步三处引用。三次都是回读发现的，自查清单一次没抓到
          （自查查「有没有违规」，不查「前后还通不通」）。**规则写了不等于会遵守**：
          本条写成后当场又犯一次，是它自己最好的实证

  - id: R-032
    layer: standard
    title: 幻想向受限豁免与主角补偿
    assertion: 仅幻想向细分（高魔奇幻/低魔奇幻/都市奇幻/科幻/赛博朋克）且已登记豁免档位时生效；
               豁免的是**叙事层胜负约束**＝允许主角光环、能力强化补偿、打赢且截肢事实不影响本场结果、
               能力全开/六类并用/位移＋支撑同开/无代价常驻/连续胜利/赢了不付身体代价；
               四界＝域界（只在战斗域，日常·身体·亲密域照写实，恢复期物理红线仍生效）／登记界（世界观＋账本，未登记即零豁免）／
               事实界（不改写 types 生理事实；截肢觉醒/馈赠仪式等「截肢即力量来源」为合法幻想题材，须登记）／
               题材界（现实向·末世生存·古装向零豁免，两向互斥）；
               代价改由 R-033 的战斗过程承担
    source: genre/fantasy.md
    severity: hard
    scope:
      题材大类: [幻想向]
  - id: R-033
    layer: standard
    title: 幻想向真实战斗冲突
    assertion: 幻想向登记为对抗/战斗的章，冲突须为拳拳到肉／真刀真枪／魔法对轰的真实战斗；
               有死有伤、过程丰富（按 R-027 回合制与动作密度）、对抗激烈（敌方四阶升级、不降智）、
               严格按选定强度执行（冲突强度档与张力级取较严者，禁降档与降回合数）；
               ❌ 禁止把冲突定义为非战斗冲突（对峙/口角/误会化解/协商/内心挣扎/制度摩擦/冷处理/
               情绪张力/「没有动手」/「经过一番周旋」式概述带过）；
               ❌ 禁止复用已有战斗过程内容（近 5 章开局态势/攻防转换顺序/决胜招/伤亡后果组合不得重复；
               逐章登记解法台账与情节事件登记，事件层与招法层分判）；现实向冲突可为非战斗，不适用本条
    source: genre/fantasy.md
    severity: hard
    scope:
      题材大类: [幻想向]
  - id: R-034
    layer: standard
    title: 默认性格禁令（全类型通用）
    assertion: 四题材通用、主角配角同——❌ 禁止把话少／冷漠／沉默寡言及其同义词
               （寡言/高冷/冷淡/不爱说话/话不多/不怎么开口/以沉默为常态）作为角色默认性格设定
               或设定阶段默认取值；落到人物卡或账本性格·声口字段须能溯源用户原话，
               无原话即违规，改填声音卡五项可验证行为；
               四种合法用法＝用户显式选择／场景态（暂时反应）／冷角色技术术语／五声口之一（非默认）
    source: core/character-setup.md
    severity: hard

# ── 四、章循环状态机（供 scripts/state_machine.py 与 gatecheck [17] 消费）──
chapter_states:
  allowed: [待规划, 已规划, 写作中, 已自查, 已冷读, 已修正, 已过闸, 已交付]
  transitions:
    待规划: [已规划]
    已规划: [写作中]
    写作中: [已自查]
    已自查: [已冷读, 已修正]        # flash 直接到已修正；pro/max 过已冷读
    已冷读: [已修正]
    已修正: [已过闸]
    已过闸: [已交付]
    已交付: [待规划]                # 下一章
  mode_exceptions:
    flash: 已自查 → 已修正（跳过已冷读，且不得伪填冷读凭证）
    pro: 已自查 → 已冷读 → 已修正
    max: 已自查 → 已冷读 → 已修正
  forbidden_jumps:
    - 写作中 → 已交付
    - 已规划 → 已过闸
    - 已自查 → 已交付

# ── 五、编译期一致性检查清单（scripts/compile_rules.py 消费）────
consistency_checks:
  boundary_pairs:
    - rule_text: 连续 3 章未记账
      code_expr: 'cur_ch - last_rec >= 3'
      file: scripts/gatecheck.py
      note: 规则文字与代码边界必须同档（历史上曾误写 > 3）；破窗窗口按篇幅分档，超长篇（≥61）为连续 4 章 0 条，见 core/chapter-planning.md 篇幅表
    - rule_text: 连续 3 章 0 条
      code_expr: 破窗
      file: core/chapter-planning.md
      note: 软硬分开；窗口内核心全 0 且无在场/余波才算
  enum_sources:
    - enum: 截肢时长档位
      files: [core/character-setup.md, topics/timeline.md, templates/character-card.md, topics/wannabe.md]
      forbidden_literals: [近期 B, 多年 C, 时长档位（B/C）]   # 已废止表述，仅登记为编译期禁用字面量；❌ 不得在正文出现
    - enum: 资源账物资
      files: [templates/state-ledger.yaml, genre/postapocalyptic.md]
      forbidden_literals: [弹药]                          # 已废止表述，仅登记为编译期禁用字面量；❌ 不得在正文出现
    - enum: 交付闸机检编号
      files: [scripts/gatecheck.py, scripts/selfcheck.py, core/workflow.md, core/chapter-planning.md, core/cold-review.md, templates/state-ledger.yaml]
      note: 同一编号只能指向一个机检项
  anchor_sources:
    - file: core/audience.md
      anchors: [★招牌元素密度与疲劳控制, ★器具损耗与更换禁令, 四道闸门, ★安全败退阀]
    - file: topics/limitation-scenes.md
      anchors: [衍生类 1, 衍生类 2, 衍生类 4, 八、受限归因判据]
    - file: core/chapter-planning.md
      anchors: [2.2 三层供给, 三、主冲突线 beat 章级规则, 五、章末钩子类型库, 9.1 六条硬规则]
    - file: core/prose-craft.md
      anchors: [一、章节剧情安排, 二、人物活性因果链, 三、文风与叙事距离, 四、写作氛围, 五、长篇文风一致性与结构层去 AI 化, 六、执行接口与不冲突声明]
    - file: core/voice.md
      anchors: [一、声音不是口癖, 二、声音四要素, 三、开写前三句试音, 四、语气切换矩阵, 五、幽默六法与边界, 七、对白不合作四型, 十一、自查三问]
    - file: core/scene-engine.md
      anchors: [一、一场戏的五件事, 二、材料三问, 三、场景与概述交替, 六、细节必须工作, 七、流水账四型与修法（局部）]
    - file: core/scene-drive.md
      anchors: [〇、先看清楚：为什么规则越加越机械, 一、做事 ≠ 动手（第一个分界）, 二、三个硬条件（缺一条就不算戏）, 三、假戏六型（最危险，因为它们有质感）, 四、详略差（流水账的真正机制）, 五、配角驱动器（一句话，决定他有没有嘴）, 六、出状态（机械感的直接来源）, 七、动笔前的四问（只问这四个）]
    - file: core/emotion.md
      anchors: [〇、情感被「平均分配」掉了（先读这一条）, 一、先把两件事分开：冷角色 ≠ 没感情, 二、情感的三层结构（缺一层就塌）, 三、五种合法呈现（都不抒情、不点破）, 四、三种伪情感（命中即改）, 五、冷角色专项：三多, 六、每章三问（写完必答，答不出就回去改事件）]
    - file: core/emotion-signal.md
      anchors: [〇、先把坑标出来（省得白改一遍）, 一、三层信号：语言 > 身体 > 面部, 二、可观察 vs 可命名（本层的核心判据）, 三、个人癖好：一个人只有一个签名动作, 五、紧张时的语言失控（六种，附正误写法）, 六、配额表（防滥用）, 七、主角与配角必须不一样, 八、写完自查（五问）]
    - file: core/intensity.md
      anchors: [一、强度曲线（每章必须有且只有一个峰值）, 二、热段许可（对治「平淡、深沉」）, 三、战斗回合制（对治「一两招就结束」）, 四、对话博弈（对治「对话不灵动」）, 五、段落卫生（❌ 本节不治流水账）, 六、写完六问（不看前面五节，只答这六句）]
    - file: genre/fantasy.md
      anchors: [十、幻想向受限豁免与主角补偿, 十一、幻想向真实战斗冲突]
    - file: core/character-setup.md
      anchors: [★默认性格禁令]
  count_checks:
    - what: 示范节清单
      expected: 三处
      files: [core/audience.md, templates/chapter.md]
    - what: 受限层级
      expected: 五层
      files: [topics/limitation-scenes.md, core/audience.md, core/cold-review.md]
    - what: 冷读维度（必判集）
      expected: 13
      files: [core/cold-review.md, core/workflow.md]
