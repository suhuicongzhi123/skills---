# 宿主 hook 平台中立规范（单一事实源）
#
# 定位：`.claude/` 目录只被 Claude Code 识别，国内 agent 平台安装技能时会忽略它。
#       本文件把 hook 语义抽成**平台无关的机器可读规范**——平台安装器 / AI / 用户
#       据此把 hook 转变为目标平台可用的形式（转变工具：scripts/install-host-hooks.py）。
# 用法：
#   有 shell：python scripts/install-host-hooks.py --platform <平台> --project-dir <项目目录> --yes
#   无 shell：AI / 用户按下述 hooks[].semantics 与 platform_registry 人工注册，并在
#             账本「工作流执行日志」写明注册形式与降级声明。
# 原则：**任何转变造成的强制力降级都必须显式声明**（静默降级比不注册更危险）。
# ⚠ 本规范描述的是「hook 语义」；Claude Code 原生形态在仓库根 `.claude/`（与本规范
#   等价，Claude Code 用户零成本，无需跑转变脚本）。

schema_version: 1
skill_version: 6.2.1

# ── 转变规则 ──────────────────────────────────────────────
conversion:
  event_hook_platform:
    desc: 有生命周期事件钩子的平台（如 Claude Code）——按 events 原样注册，强制力＝宿主强制
  rule_resident_platform:
    desc: 无事件钩子、有规则常驻机制的平台（多数国内平台）——hook 语义转为规则文件注入；
          强制力从「宿主强制」降级为「规则常驻＋AI 自律」，**必须在生成物中显式声明降级**
  unknown_platform:
    desc: 注册位置/格式未核实的平台——输出本规范摘要＋人工注册指引＋降级声明，
          ❌ 不得假装已注册成功

# ── hook 语义（四条，与 .claude/ 接入层一一对应）──────────
hooks:
  - id: hard-layer-inject
    title: 硬约束常驻层强制注入
    events: [session_start, before_chapter_write, pre_compact]
    action: inject_file
    file: rules/hard-layer.md
    whole_file: true          # 整段注入，❌ 禁止摘要、禁止参与语义检索/相似度裁剪
    re_inject: 每章开写前重注入（防长会话压缩驱逐）
    enforcement: host_forced  # 事件钩子平台＝宿主强制；规则常驻平台＝AI 自律（降级）
    degrade_notice: 规则常驻形态下，硬层驱逐风险回到「压缩/长会话后可能丢失」——每章开写前重读是最低补偿
    pre_compact_note: |
      v6.2.0 压缩应对：宿主压缩前触发本 hook（Claude Code PreCompact 事件）时，
      执行压缩恢复协议的引导动作——把「压缩后先跑 core/workflow.md#压缩恢复协议
      （最小恢复集①硬层②规则包③章契约④账本坐标⑤上章末500字）」写入压缩摘要引导；
      无该事件的平台由 AI 在收到写作/续写指令时自检触发（SKILL.md#〇-压）。

  - id: chapter-rules-expand
    title: 本章规则包展开
    events: [before_chapter_write]
    action: run_command
    command: python scripts/query_rules.py --genre <题材> --type <类型> --tier <尺度档> --mode <模式> --chapter-kind <章型> --conflict <冲突强度档> --chapter <N> --format text
    params_from: 账本「角色固定属性」与「章节状态」块
    out: 项目目录/chapter-rules-N.md（❌ 不得写入技能目录覆盖模板）
    fallback: 无 shell 平台由宿主预先跑 --format text 把产物拼进 system prompt
    enforcement: prompt_convention

  - id: verify-gate
    title: 交付闸四链机检
    events: [before_commit, before_deliver]
    action: run_commands
    commands:
      - python scripts/selfcheck.py
      - python scripts/compile_rules.py
      - python scripts/state_machine.py --ledger <账本> --check
      - python scripts/gatecheck.py <项目目录> --chapter N
    exit_nonzero: 不得交付、不得 commit；修复后重跑直至全 PASS
    enforcement: prompt_convention   # Claude Code 上有 verify 命名约定加持（commit 前自动指示运行）

  - id: redteam-review
    title: 红队验证（独立上下文）
    events: [chapter_review_pro_max]
    action: subagent_fork
    brief: templates/redteam-brief.md
    input_isolation: true     # 输入隔离，禁止自证「自查未发现」；全过也须 ≥3 段反证轮
    degrade_notice: 无真独立子代理 ⇒ 独立性声明作废，质量等级降为「自审」，❌ 不得用同会话角色扮演顶替

# ── 平台注册表（公开资料整理；verified: false 项格式未官方实测，注册前须按平台文档核对）──
platform_registry:
  claude-code:
    form: event_hook
    config: .claude/settings.json（仓库根已随仓库分发，零成本）
    verified: true
    note: hook 事件集与 context:fork 为 Claude Code 专有扩展
  codebuddy:
    form: rule_resident
    config: 项目根 .codebuddy/ 规则目录
    verified: false
    note: 腾讯 CodeBuddy；规则目录形态按实际版本核对，事件钩子能力未官方核实
  trae:
    form: rule_resident
    config: 项目根 .trae/rules/
    verified: false
    note: 字节 TRAE；rules 目录为公开文档形态，事件钩子能力未官方核实
  qoder:
    form: rule_resident
    config: 项目根 .qoder/ 规则目录
    verified: false
    note: 阿里 Qoder；形态按实际版本核对
  kimi-code:
    form: rule_resident
    config: 项目根 .kimi/ 规则目录
    verified: false
    note: 月之暗面 Kimi Code；形态按实际版本核对
  generic:
    form: unknown
    config: 按平台文档人工注册
    verified: false
    note: 未登记平台——读 hooks[].semantics 人工注册并显式声明降级