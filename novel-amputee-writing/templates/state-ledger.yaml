# 全书状态流水账（运行时状态文件，开书时复制至小说项目工作区）
# 每场景/章后更新，写下一段前核查
# 固定属性全书锁定，动态属性跟踪

角色固定属性:
  截肢部位大类: 下肢              # 上肢 | 下肢，全书不可变
  截肢类型: 髋离断                  # 全书不可变（对应 types/hip-disarticulation.md）
  截肢侧别: 右                      # 全书不可变
  截肢部位: 髋关节离断              # 全书不可变

当前状态:
  章: 1
  场景:
  主角姿态: 站                      # 站/坐/躺/走/车
  拐杖:                            # 仅下肢截肢适用；上肢截肢置空或删
    数量: 双拐                      # 双拐/单拐/无
    状态: 在手中                    # 在手/靠墙/放倒/夹腋/挂腕/不在场
    位置:
  假肢:
    状态: 脱下                      # 穿/脱/不在场
    位置:
  重要物品:
    手机:
    钥匙:
    包:
    杯:
  上一动作:

open_setups:                       # 跨弧线跟踪 setup/payoff，每章更新（见 core/structure.md）
  # - 描述: "第2章提到主角回避配新拐杖"
  #   状态: open                    # open/paid/abandoned
  #   埋设章: 2
  #   预期payoff:

核查记录:
  - 章: 1
    场景:
    部位大类: 下肢 ✓
    侧别: 右 ✓
    部位: 髋离断 ✓
    拐杖连续: ✓                     # 下肢查；上肢查单手任务
    物品位置: ✓
    双手占用: ✓                     # 下肢查双手+移动；上肢查双手任务
    回避清单: ✓