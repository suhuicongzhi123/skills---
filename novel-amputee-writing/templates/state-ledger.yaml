# 全书状态流水账（运行时状态文件，开书时复制至小说项目工作区）
# 每场景/章后更新，写下一段前核查
# 固定属性全书锁定，动态属性跟踪
# 滚动窗口：核查记录只保留近 5 章，更早的移入同目录 state-ledger-archive.yaml
# state-ledger-archive.yaml 为运行时产物（滚动窗口归档），开书时随账本创建于小说项目工作区，技能包内无此文件

角色固定属性:
  截肢部位大类:                      # 上肢 | 下肢 | 上下肢复合，全书不可变
                                     # 复合＝{type} 取两份并行注入，按域分工，见 SKILL.md#★上下肢复合
  截肢类型:                          # 全书不可变（对应 types/{type}.md）
  截肢侧别:                          # 左 | 右 | 双
  截肢部位:                          # 全书不可变
  截肢时长档位:                      # 先天 | 近期 | 多年；决定幻肢感频率，见 topics/timeline.md
  训练程度: 熟练                    # 初学 | 熟练 | 长期适应；只影响弱受限的呈现（初学更早歇/放弃，长期适应完成但代价高，见 topics/limitation-scenes.md 一-补；不影响能否蹲）
  辅具类型:                          # 腋拐 | 肘拐(前臂拐) | 平台拐 | 腋拐肘拐混用 | 假肢为主 | 拐杖假肢并用 | 无(单腿跳/替代移动) | 其他(注明)；上肢截肢置空；「无」时受限类「辅助器具剥夺」「双手占用」不触发
  叙事视角:                          # 第一人称 | 第三人称限知 | 第三人称全知
  受众取向: devotee                 # devotee(默认) | wannabe | 双取向；默认读者身份，非角色
  视角身份定位: 仅读者视角            # 仅读者视角 | 作为角色入戏（后者须填剧情功能）
  招牌元素密度档: 默认               # 默认 | 上浮一档；仅当用户在设定阶段显式要求时改，见 core/audience.md
  亲密尺度档: B                      # A 含蓄 | B 暧昧 | C 成人；C 须用户显式声明
  时长档位跃迁章:                    # 仅 wannabe 主角填：跃迁前按 A 档 0 次，跃迁后按 B 档

世界观锁定:
  缺失解释框架:                      # 常态化 | 神圣化 | 无解释 | 病因学 | 隐秘；一书锁定，
                                     # 神圣化须用户显式选定，见 core/worldbuilding.md#一-补、缺失解释框架（防雷同锁定字段）

当前状态:
  章: 1
  场景:
  场景序号: 1                        # 本章第几个场景；章内多场景时逐场景更新，避免状态被覆盖
  主角姿态: 站                      # 站/坐/躺/走/车
  拐杖:                            # 仅下肢截肢适用；上肢截肢置空或删
    数量: 双拐                      # 双拐/单拐/无
    状态: 在手                      # 在手 | 靠墙 | 放倒 | 夹腋 | 挂腕 | 挂肘 | 交他人 | 不在场
    位置:
  假肢:
    状态: 脱                        # 穿 | 脱 | 不在场
    位置:
  辅具空白期:                      # 拐杖与假肢均「不在场」时启用（见 topics/limitation-scenes.md 衍生类 1 ★辅具空白期）
    起章:                          # 空白期自第几章开始
    出口:                          # 取回 | 重获 | 转入无辅具 —— 连续 5 章以上须明确出口；
                                   # 选「转入无辅具」时 角色固定属性.辅具类型 改登记 无(单腿跳/替代移动)
  重要物品:                          # 开放式键值，按需增行（备用拐/证件/药/礼物/凶器等）
    手机:
    钥匙:
    包:
    杯:
  上一动作:

本章登记:                            # 章末登记，跨章可查（见 core/chapter-planning.md）
  阅读承诺:                        # 章首给读者的期待（本章 beat 的具体化）；章末须回应（兑现/翻转/推进）
  张力级:                          # 1–5；见 templates/outline.md#★体验强度曲线
  节拍角色:                        # 蓄 | 爆 | 呼 | 转
  上章钩子接住:                    # 接住 | 部分接住 | 未接住（未接住须注明是否故意延迟）
  上章钩子回收:                    # 本章回收的旧钩子章号，无则留空
  本章beat:
  本章turn:
  新信息:
  章节功能:                          # 主线推进 | 关系深化 | 日常样态 | 危机
  stakes:
  章末钩子类型:                      # H1悬念|H2决定|H3到来|H4威胁|H5倒计时|H6抉择|H7揭示 或 弱钩 h8情绪|h9画面|h10回声
  近五章钩子类型: []                 # 滚动窗口，用于判定钩子不重复
  受限beat:                          # ★识别优先（软下限：连续 3 章内 ≥2 个核心受限）；弱受限/本章无核心受限 → 整块留空（合法状态），见 core/audience.md#受限清单
    类型:                            # 功能丧失(主) / 辅助器具剥夺 / 双手占用 / 速度劣势 / 对立挑衅 / 环境与他者（用中文类名；无辅具时不选「辅助器具剥夺」）
    场景:
    处置:                            # 她的处置；空缺即为"只呈现没处置"
  受限类型近三章: []                 # 判定「不连续两章用同一类」+软下限计数（连续 3 章内 ≥2 个核心受限）。
                                     # 维护规则：逐章由 本章登记.受限beat.类型 累积，满三章弹出最旧；
                                     # 无核心受限章不入列但占窗口位（判定软下限：列表长度 + 空章数 = 3，
                                     # 长度 <2 即窗口不足——标记提示后续补足，不强造）；
                                     # 判「不与上章同类」时：仅当最近一章有登记才比对（空章无约束）
  幻肢触发:                          # 无则留空；有则记 档位 + 触发类型
    档位:                            # B 近期 | C 多年
    触发:                            # 运动性触发须在 timeline.md 合法触发清单内；非运动性存在感（形态学四件套）另行合法

本章自评:                          # 章末必答，供冷读抽查（见 templates/chapter.md ★文学自评）
  代入感主通道:
  最跟着她的一句:
  最生动的一句_附技法:
  声口是否贴人物卡:
  受限在乎:
  最高张力句式:
  对话双功能:

时间线:                            # 跨章一致性：全书时间流逝，防止季节/间隔矛盾
  全书跨度:
  本章时间点:
  距上章间隔:
  季节/天气:
  已过关键节点:                    # 节日/季节/纪念日，跨章不得漂移

关系状态:                          # 谁与主角处于何种阶段，跨章不得回退；每增一人复制一整块
  - 角色:
    阶段:                          # 陌生/接近/信任/亲密/破裂/疏远
    最近变化章:

信息状态:                          # 谁知道什么，防止秘密泄露不一致；每条秘密复制一整块
  - 秘密:
    知情者:
    揭示章:

角色弧状态:                        # 主角心理/态度进展，防止成长回退
  当前信念:
  已松动点:
  待触发:

distribution:                      # 招牌 beat 全书分布跟踪（见 core/audience.md#招牌元素密度与疲劳控制）
  元素上次出现章:                  # 常规型(③④⑤⑥⑦)限频判定用（同一元素出现间隔 ≥2 章——限频非排班）；
                                     # ①②为触发型（见两档供给）——契机出现时登记，不限频
    残肢/剩余部分细节: 0            # 触发型：裸露/目光接触/器具穿脱/体感事件契机才写
    颤动: 0                         # 触发型：常与幻肢肌肉反应联动
    幻肢感: 0
    空: 0
    辅助器具特写: 0
    被看见: 0
    亲密中的身体: 0
  首章beat数: 0                    # 硬约束：首章 ≤2 类
  已覆盖类别: []                   # 素材面健康度体检用（冷读项：连续 8 章常规型 <4 类时提示检查契机标注）
  近三章beat:                      # 限频：常规型同一元素不得连续两章出现（触发型①②豁免，见两档供给）
    - 章: 0
      元素:
  examples_used:                   # 心动句/意象载体谱系（防跨章复用同一载体）
    - 章: 0
      载体:                        # 空椅面/袖管/拐头磨损/接受腔压痕/断口软肉/残端肌肉隆起（主动发力）/握拐指节/雨夜赶车/够高处/被注视(善意·好奇·审视·怜悯·欣赏)…
      手法:                        # 炼字/通感/白描/叠词音韵/以物写人/留白
      收尾:                        # 动作停顿/画面定格/情绪留白/悬念未完/日常收束
    # 维护：逐章累积保留近 5 章；同载体 或 同手法+收尾 在窗口内出现 2 次即提示换法
  幻肢感出现章: []                 # 对照时间档位核验频率（见 topics/timeline.md）
  开篇维度:                         # 本本所选开篇维度（见 core/opening.md）
  已用开篇维度: []                  # 跨次去重：同设定多次创作时避开已用维度

open_setups:                       # 跨弧线跟踪 setup/payoff，每章更新（见 core/structure.md）
                                   # 全书级钩子（心愿线/软肋兑现/关系里程碑/器物人生）也在此登记——
                                   # 沿用下方现有字段：描述=类型+简述、埋设章=首提章、预期payoff章=兑现章计划、
                                   # 剧情功能=钩子线名（见 core/structure.md 截肢题材适配）；
                                   # 全书级钩子跨度全书是设计——预期payoff章=兑现里程碑章，
                                   # 不受「超过 5 章未兑现判 abandoned」约束（该规则适用于章级伏笔）
  - 描述:
    状态: open                     # open/paid/abandoned
    埋设章:
    预期payoff章:                  # 章级伏笔：超过此章 5 章仍未兑现 → 判定 abandoned 或重新埋设
    剧情功能:

核查记录:                          # 滚动窗口：只保留近 5 章，更早移入 state-ledger-archive.yaml
  - 章: 1
    场景:
    部位大类: 下肢 ✓
    侧别: 右 ✓
    部位: 髋离断 ✓
    拐杖连续: ✓                     # 下肢查；上肢查单手任务
    物品位置: ✓
    双手占用: ✓                     # 下肢查双手+移动；上肢查双手任务
    回避清单: ✓
    beat与turn: ✓
    stakes变化: ✓
    钩子类型: ✓
    密度与频率: ✓                   # 招牌元素不连续重复 / 幻肢感符合档位
