  截肢部位:                          # 全书不可变
  截肢时长档位:                      # 先天档 | 近期档 | 多年档（**一律写中文，不用字母**——A/B/C 在本库专指亲密尺度档）；决定幻肢感频率，见 topics/timeline.md
  训练程度: 熟练                    # 初学 | 熟练 | 长期适应；只影响弱受限的呈现（初学更早歇/放弃，长期适应完成但代价高，见 topics/limitation-scenes.md 一-补；不影响能否蹲）
  辅具类型:                          # 腋拐 | 肘拐(前臂拐) | 平台拐 | 腋拐肘拐混用 | 假肢 | 拐杖假肢并用 | 无(单腿跳)；限定四类及组合（SKILL.md#〇-补 第 3 类：其他物品不作辅具）；上肢截肢置空；「无」时受限类「辅助器具剥夺」「双手占用」不触发
  叙事视角:                          # 第一人称 | 第三人称限知 | 第三人称全知
