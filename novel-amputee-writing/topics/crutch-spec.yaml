# 拐杖物理属性（纯数据）
# 供 topics/crutch-usage.md 及 types/{type}.md#拐杖使用差异 引用
# 单腿截肢者（尤其髋离断）以双拐为主要行走工具
# ⚠ 本文件仅覆盖现代工业制品（木/铝/碳纤维）。古装向、低技术架空题材不适用，
#   须在世界观里自建器具表，见 genre/historical.md

crutch_types:
  axillary:
    name: 腋拐
    alias: [腋杖, underarm crutch]
    common_use: 髋离断者常用；**本技能默认辅具**
    note: 受众偏好优先——腋拐是本受众最具标识度的外观，故设为默认。
      可写腋下轻触压痕/不适（长期轻触+摩擦所致，非承重压痕；属日常不便，不作苦难渲染）
    structure:
      axillary_pad: {name: 腋托, material: 海绵/橡胶软垫, function: 抵腋窝}
      handgrip: {name: 手柄, material: 泡沫/橡胶/塑料, function: 握持, position: 中部}
      uprights: {name: 双立杆, material: 木/铝/碳纤维, function: 承重}
      crossbar: {name: 横梁, function: 连接双杆加固}
      tip: {name: 拐头, material: 橡胶/聚氨酯, function: 防滑缓冲静音}
      # ⚠ 拐头"用久会磨损需更换"是物理事实，但**写作侧禁用**：不得写成磨损/打滑/更换/备用的
      #    情节、特写或台词——见 core/audience.md#★器具损耗与更换禁令（替换方向见该节四条）
    weight_kg: {wood: 1.0~1.5, aluminum: 0.7~1.0, carbon: 0.5~0.7}
    height_adjustment: 调节孔位或伸缩锁扣
    use_principle: "**手柄承重原则：体重压在手柄上，腋托只轻触定位、不承重**（压腋窝→桡神经/臂丛受压→拐杖麻痹）。长期使用者的器具勋章在手上：虎口茧、掌心磨、握力疲劳——这些比腋下压痕更高频真实"
  forearm:
    name: 前臂拐
    alias: [Lofstrand, 洛氏拐, 肘拐, forearm crutch]
    common_use: 可选辅具（本技能默认腋拐；前臂拐为可替换选项，较轻便灵活）
    structure:
      # 理由：近端固定才有效悬吊，前臂远端约2/3外露、手才能自由伸出做事（够门把/捡物/掏钥匙而拐仍挂臂——挂臂期间该拐不撑地不承重，支撑减半、以原地作业为主）——这是 topics/hands-occupied.md「挂肘腾手」成立的物理前提；cuff 装远端则肘下无承托、易滑脱、手被锁死
      cuff: {name: 前臂套, material: 金属/塑料, function: 固定前臂, position: 肘下约两三横指}
      handgrip: {name: 手柄, position: 与腕横纹齐}
      upright: {name: 单立杆, material: 铝/碳纤维}
      tip: {name: 拐头, material: 橡胶/聚氨酯}
    weight_kg: {aluminum: 0.5~0.8, carbon: 0.4~0.6}
  platform:
    name: 平台拐
    alias: [平台式前臂拐]
    common_use: 手部握力不足或关节受限者
    structure:
      platform: {name: 前臂平台, function: 承托前臂}
      upright: {name: 单立杆}
      tip: {name: 拐头}

sizing:
  axillary:
    腋托高度: 站立腋下至地面减约5cm（约三横指）
    注: ❌ 不平大转子——大转子在髋部，是肘拐/手杖的参考点，腋托在腋下
    手柄高度: 屈肘约30°、腕横纹处
    原理: 腋托过高压腋窝神经血管，过低肩带受力不当
  forearm:
    手柄高度: 腕横纹处
    cuff高度: 前臂近端1/3（肘下两三横指）
  通用: 拐头落地时杆身垂直，防滑头全接触地面

gait_patterns:
  三点步态:
    适用: 患侧可部分负重者
    本技能: 不适用，勿写（单腿截肢且患侧不承重时不存在第三点，见 topics/crutch-usage.md）
  摆至步:
    顺序: 双拐先出→健腿摆至拐杖水平
    特点: 省力，速度慢，台阶/拥挤处常用
  摆过步:
    顺序: 双拐先出→健腿摆过拐杖前方
    特点: 快、步幅大、**耗力**（熟练者的快走方式，代价是手酸），平地常用
  四点步态:
    顺序: 右拐→左腿→左拐→右腿
    适用: 双腿均有部分负重（截肢者较少用）

stairs:
  上楼: 健腿先上→拐杖跟上
  下楼: 拐杖先下→健腿跟下
  口诀: 健上拐下（好腿先上，拐杖先下）
  扶手: 有扶手时一手扶栏一手持双拐并拢