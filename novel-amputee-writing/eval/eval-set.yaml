# 回归评测集（方向④ · 离线优化用）
#
# 定位：把历史上**人工逐字校对才抓到、机检全 PASS 时照样存在**的真实问题沉淀成用例，
#       供 scripts/optimize_prompts.py 评估注入顺序 / 自查提示 / 红队视图的有效性。
# 用法：改注入顺序或自查提示后，用本集逐条人工核对（尤其评测用例 L3）；本集不产出命中率结论。
# ⚠ 本集**不进入创作上下文**（不在按需注入索引里），只在离线优化与红队演练时读取。
# ⚠ 平台兼容：本文件是纯数据，任何平台可解析；optimize_prompts.py 当前输出静态评分（DSPy 自动优化为预留接口）。
# ⚠ 逐字校对须知：E-011 / E-014 的 wrong 字段**刻意保留英文直引号**——
#   它们是黑名单字面量，用于匹配真实错误写法；改成「」会让黑名单失效，不是笔误。
#   E-020 / E-021 / E-022 及 E-023～E-028 的 wrong 均为**描述性反例**
#   （不写 DEAD 词表完整字面量，避免 [3] 判成复发）；
#   逐字反例全表见 core/style.md 的「★AI 高频句式家族」「★人物活性」「★伪活性判定」三节，
#   以及 core/prose-craft.md 的第四、五节（氛围词禁令／结构层八族）。

schema_version: 1
skill_version: 9.7.5

# 每条用例：历史上真实发生过的问题 + 期望被哪一层拦住
# level: L0=纯数据/离线可判 · L1=编译期可判 · L2=生成期可判 · L3=仅语义/人工可判
cases:
  - id: E-001
    title: 代码边界差一档
    history: 规则文字「连续 3 章未记账」，代码初版写成 `差 > 3`（＝连续 4 章才报）；
             五分支测试因只取差 2 与差 5 而未暴露。
    wrong: 'cur_ch - last_rec > 3'
    right: 'cur_ch - last_rec >= 3'
    catch_by: scripts/compile_rules.py BND-03
    level: L1

  - id: E-002
    title: 机检编号引用错
    history: 三处文档把硬闸机检写成 [16]（实为 [15]，[16] 是资源账），自检不校验文档里的编号引用。
    wrong: gatecheck [16] 机检读取硬闸自查
    right: gatecheck [15] 机检读取硬闸自查
    catch_by: scripts/compile_rules.py NUM-02 / 人工校对
    level: L1

  - id: E-003
    title: 跨文件术语不一致
    history: 账本写「弹药」、题材包写「子弹」；自检查不出（都是合法文本）。
    wrong: 燃料 / 弹药 / 电池
    right: 燃料 / 子弹 / 电池
    catch_by: scripts/compile_rules.py ENUM-01
    level: L1

  - id: E-004
    title: 限频旧措辞残留
    history: 主文改了 N+2 口径，另六处仍写「间隔 ≥2 章」（字面算成 N+3）。
    wrong: 同一元素出现间隔 ≥2 章
    right: 同一元素两次出现之间至少隔 1 章（第 N 章后最早 N+2 章再现）
    catch_by: 人工校对 + compile_rules.py count_checks
    level: L2

  - id: E-005
    title: 口径未同步（绝对化跨障）
    history: 权威源改为「低障可跃、高障须绕」，四个下游文件仍写「不能跨」。
    wrong: 不能追/不能跨
    right: 跨障受限（低障可跃、高障须绕）
    catch_by: 人工校对 + rules.yaml R-007
    level: L2

  - id: E-006
    title: 锚点标点不一致
    history: 小节标题用英文句点（如 core/workflow.md 的 8. 架构层接口），
             引用若写成顿号（8、架构层接口）即落空；norm() 剥「、（）」但不剥英文句点。
    wrong: 标题写 8. 却引用成 8、（顿号与句点混用）
    right: 引用须与标题逐字一致，含标点；core/workflow.md 的第 8 节用英文句点
    catch_by: scripts/selfcheck.py [1]
    level: L0

  - id: E-007
    title: 引用了不存在的裸文件名
    history: 模板里把账本写成裸文件名后接键名，包内路径须带 templates/ 目录前缀。
    wrong: 裸文件名加锚点（写作 state-ledger.yaml 后接键名，未带 templates/ 前缀）
    right: 用带目录的完整路径 templates/state-ledger.yaml 再接键名
    catch_by: scripts/selfcheck.py [1b]
    level: L0

  - id: E-008
    title: 新增文件零引用
    history: 孤儿文件判定只看 .md/.yaml 的 basename 是否在其他文件出现。
    wrong: 新增模板在全库零引用，或把「只登记 SKILL.md 即可」当成唯一合法形式
    right: 新增 .md/.yaml 的 basename 须在全库任一 .md/.yaml（CHANGELOG.md 除外）中出现；推荐在 SKILL.md 注入索引登记；types/ 与 genre/ 另有通配豁免。机检口径以 scripts/selfcheck.py [4] 为准
    catch_by: scripts/selfcheck.py [4]
    level: L0

  - id: E-009
    title: 口径冲突（环境与受限归因）
    history: 曾写「环境即受限来源」，与全库「环境只放大、不作受限来源」矛盾。
    wrong: 环境即受限来源
    right: 环境只放大、不作受限来源
    catch_by: 人工校对 + rules.yaml R-010
    level: L3

  - id: E-010
    title: 中文句混入英文词
    history: 古装题材必带项里写了「household 结构」。
    wrong: 目击者身份须符合该时代 household 结构
    right: 目击者身份须符合该时代的家庭与宅院结构
    catch_by: 人工逐字校对
    level: L3

  - id: E-011
    title: 引号风格不统一
    history: 新增段落用英文直引号，库内一律「」。
    wrong: 摘要只写"接下来要写什么"
    right: 摘要只写「接下来要写什么」
    catch_by: 人工逐字校对
    level: L3

  - id: E-012
    title: 伪规则（AI 无能力/权限执行）
    history: 曾写「才允许发生压缩」「压缩触发时四步」，但 AI 控制不了、也察觉不到压缩。
    wrong: 全部落盘后，才允许发生压缩
    right: 落盘是每章章末的例行动作；恢复绑定「下一章开写前」这个无条件时点
    catch_by: 人工校对（能力/权限审查）
    level: L3

  - id: E-013
    title: 冷读独立性静默降级
    history: 平台不支持真子代理时，用同会话角色扮演顶替，报告外观不变但独立性已失效。
    wrong: 声称「独立冷读」但审查员与主代理共享上下文
    right: 显式声明「无独立上下文 ⇒ 独立性作废」，见 PLATFORM-CN.md
    catch_by: 平台能力探测 + 显式降级声明
    level: L3

  - id: E-014
    title: 硬约束被压缩驱逐
    history: 自动压缩后只重挂最近一次 Skill 调用的前 5000 tokens，早先调用被整个丢弃。
    wrong: 把禁令层交给语义检索 / 依赖"还在上下文里"
    right: 硬层常驻 + 每章开写前重注入（hook 或宿主 system prompt）
    catch_by: rules/hard-layer.md 常驻声明
    level: L3

  - id: E-015
    title: 未成年硬闸被世界观绕过
    history: 古装「及笄＝可婚」被当作成年线。
    wrong: 及笄即成年，可排 B/C 档
    right: 及笄/弱冠不等于本技能成年线，须写具体岁数 ≥18
    catch_by: gatecheck [15] + rules.yaml INV-02
    level: L1

  - id: E-016
    title: 状态机接口段语义不一致
    history: state_machine --advance 产生跨章累计轨迹（已交付→待规划 回卷即其设计），
             gatecheck [17] 闭环判定却假设轨迹是本章的——第 2 章起必含历史「已过闸」，中间态过闸必误报；
             v5.24.0 六分支回归用例为单章轨迹，未覆盖累计场景。
    wrong: 闭环判定读全轨迹（历史章已过闸污染当前章义务）
    right: 闭环判定读当前章段＝最后一次「已交付 → 待规划」回卷点之后的段
    catch_by: gatecheck [17] 修复＋六分支回归（含跨章累计轨迹用例）
    level: L1

  - id: E-017
    title: 子进程管道编码随平台漂移
    history: validate_output.py 的 subprocess.run(text=True) 未指定 encoding，
             Windows GBK locale 解码子进程 UTF-8 输出抛 UnicodeDecodeError——
             读线程崩溃、四项子检查结果全丢、--json 输出损坏；测试环境非 Windows 未暴露。
    wrong: subprocess.run(..., text=True) 裸用（编码继承宿主 locale）
    right: encoding="utf-8" + errors="replace" + env PYTHONIOENCODING=utf-8 两侧对齐
    catch_by: Windows 实测 + 跨平台回归
    level: L1

  - id: E-018
    title: 结构化重写抹掉注释数据
    history: state_machine --advance 落盘用 yaml.safe_dump 全量重写账本，
             行内注释与手写格式全部丢失（实测顶部注释被删）、缩进漂移。
    wrong: 读入-改字段-safe_dump 全量回写
    right: 文本级推进（patch_ledger）——只替换当前态/轨迹两行值，其余逐字保留
    catch_by: 推进前后文件 diff 对比（注释保留断言）
    level: L2

  - id: E-019
    title: 账目隐喻格言复发
    history: 用户实测点名「这是X的账，让Y自己平」句式及其衍生（你的账/我的账/她的账、
             「自己平/算/还」类收束动词变体）——AI 格言式收束套路；本题材特有危害：把她的身体/受限
             写成「要摆平的债」暗合补偿叙事（残缺≠亏欠，没有「平」的义务）。
    wrong: 用账目/债务隐喻收束人格/关系/责任/身体（「这是X的账，让Y自己平」）
    right: 停在具体动作或她的具体反应；真实物资账目情节（记账场景）不受影响
    catch_by: selfcheck DEAD 词表 7 项（禁令句人工确认档）+ style.md 去AI化节 + S41 自查
    level: L1

  - id: E-020
    title: AI 高频格言/升华句式家族复发
    history: v6.2.1 只点了账目隐喻格言一族；用户要求补齐其他 AI 高频收束腔
             （泛化顿悟 / 时间命运金句 / 定义式反转 / 得失对仗宣言 / 空泛并列感悟 / 万能沉默占位）。
             禁因同族：替角色下判断、替读者做总结；得失对仗另有本题材补偿叙事危害。
    wrong: ❌ 六族句式用于章末/段末收束定性（逐字反例与合法边界见 core/style.md#★AI 高频句式家族）
    right: 删或改成具体的人、物、缘由；带具体缘由的人物判断、真实对话、情绪留白不受影响
    catch_by: selfcheck DEAD 词表 8 项（人工确认档）+ style.md 去AI化节 + S41 自查
    level: L1

  - id: E-021
    title: 人物呆板／机械（全章只有合规动作）
    history: 用户实测反馈「创作时女主角很呆板很机械」。根因不是缺人物设定，而是写作链路只注入减法：
             IR 规则全是禁令/配额/生理，本章规则包从不给「要写活人」的正向指令；
             压缩恢复最小恢复集只回禁令与坐标、不回人物活性锚；人物卡原本缺「声口」字段
             却被 chapter.md 文学自评第 2 项引用；去AI化改写对照的正例全是外显动作。
    wrong: ❌ 整章反应＝把拐靠在门边／没抬眼／水开了没去关一类「换谁都成立」的合规动作
    right: 每章至少 1 处**可验证的立场**（遮住标签仍认得出声口 / 台词在得到·隐藏·改变平衡 /
           有代价且最违背自我形象的选择 / 每个给镜头的人答得出在争取什么）；
           上下文已成立时允许直写情绪；压缩后开写前回读账本人物活性锚
    catch_by: 人工逐字校对（语义层）+ core/style.md#★人物活性 + R-023 + S41
    level: L3

  - id: E-022
    title: 伪活性复发（替换产物成为新模板）
    history: 用户点名 6.2.2 初版的一条「正向示例」：用精巧小动作泄露内心、再配括号技法自评，
             本身就是另一族 AI 腔，❌ 不能当正例。逐字反例见 core/style.md#★伪活性判定。
             检索所得通行判据：改写应沿用原文已有的选择 / 台词 / 物件 / 后果，不另加动作；
             不用另一套微动作轮换（替换产物反复出现本身成为新模板指纹）；
             动作之后不解释（cut the gloss）；写法抽查「用微动作代替立场 / 把算计写成旁白」。
    wrong: ❌ 删掉套话后补一个意味深长的小动作 + 点破句 + 括号技法自评
    right: 删除优先；要留信息就沿用本章已有台词 / 选择 / 物件 / 后果；要补活性就补立场与代价，
           不是补动作；四步修法见 core/style.md#★伪活性判定
    catch_by: 人工逐字校对（语义层）+ core/style.md#★伪活性判定 + R-022/R-023 + S41
    level: L3

  - id: E-023
    title: 结构层 AI 痕迹八族复发（词句全绿、整页仍像模型）
    history: v6.2.2 前的去 AI 化全部落在词句层（套话／六族／破折号／伪活性）；
             2025–2026 去 AI 清单指出更隐蔽的一族在段落与结构层：三项并列、同型段首、
             场景总结尾、感官清单化、情绪直说、安全中性腔、对话同一语域。
             逐处看都合法，合计密度即污染——与破折号总闸是同一个病；
             H 族（流水账／等权重动作链）是更深的一族：枚举、交代、收齐，修法是从属化。
    wrong: ❌ 只查词句层、逐处放行，全章合计密度不查；段落形状、戏剧权重与角色语域不进自查
    right: 按 core/prose-craft.md 第五节逐族报全章合计密度，四层同过
           （词句→结构→跨章→编辑顺序），修法仍以删除优先
    catch_by: 人工逐字校对（语义层）+ core/prose-craft.md + R-024 + S41 + 冷读维度 15
    level: L3

  - id: E-024
    title: 章节「然后」链／无灾难（靠漂亮句子掩盖结构缺口）
    history: 场景—续篇结构（Swain）与 BUT/THEREFORE 因果链是长篇推进的骨架；
             AI 逐章生成时最易写成时间顺延：事件一个接一个、没有目标、结尾一切照旧，
             且润色阶段习惯靠改句子补救——句子改得再好也修不好没有 turn 的场景。
    wrong: ❌ 场间连接只能填「然后」，缺目标／静态冲突／结局「是」／无续篇，却进入行级润色
    right: 开写前填场景—续篇链（目标→逐拍升级→灾难四型→决定→下一场目标），
           章末过五问诊断；结构遍不过不许进声音遍与行级遍
    catch_by: 章契约链检表 + core/prose-craft.md 第一节 + R-024 + S01/S02/S04 + 冷读维度 10
    level: L3

  - id: E-025
    title: 氛围清单化与叙事距离跳档
    history: 氛围词本身不制造氛围；检索所得共识是让环境经视角人物的注意力过滤后
             只留下 1–2 条感官通道，并以反声写静。AI 常见病是全通道罗列、
             抽象概括词收尾，以及一段内无标记跳进他人内心（限知视角泄漏）。
    wrong: ❌ 用氛围结论词和五感清单造氛围，或叙述距离忽远忽近、写出角色不可能知道的信息
    right: 按 core/prose-craft.md 第三、四节标距离档、定注意模式、删氛围结论词；
           环境细节须有因果或属意象母题变奏；冲突段感官 ≤1–3 句
    catch_by: 人工逐字校对（语义层）+ core/prose-craft.md + R-024 + 冷读维度 20/22
    level: L3

  - id: E-026
    title: 跨章文风指纹复发（单章合规、全书换腔）
    history: AI slop 是累积的——逐章独立润色查不出同一句式家族、章末收束型、
             意象母题同写法的跨章复用；2026 长篇一致性评测把「叙事风格」列为
             与事实／时间线／角色／世界观并列的独立错误维。
    wrong: ❌ 无跨章文风台账，逐章各自润色，近 5 章同一句式家族或收束型反复出现
    right: 账本 distribution.文风指纹 与 distribution.意象母题 逐章登记并比对近 5 章；
           同家族 ≥2 次换写法，母题按变奏三选一；示范节清单三处与 R-018 口径不变
    catch_by: 账本窗口比对 + core/prose-craft.md 第五节 + R-024 + S46 + 冷读维度 17
    level: L3

  - id: E-027
    title: 正式技能规范符合性（frontmatter／自包含／渐进式披露）
    history: 大改时最易把详细规则堆回 SKILL.md、给 frontmatter 加宿主不识别的字段、
             让技能包依赖包外的宿主接入层，或新增文件零引用（孤儿文件是历史高发复发项）。
    wrong: SKILL.md 正文承载规则细节；description 用第二人称或含尖括号；
           新增 .md 全库零引用；包外目录被当作运行前提且无降级声明
    right: frontmatter 只留 name/description（＋version/author）；SKILL.md 只留导航与契约，
           详细规则进按需层；包内资源自足，接入层缺失须显式降级声明；
           改完跑 scripts/verify.py（统一入口：编译检查＋库内自检），PASS 才算完成；
           宿主 quick_validate.py 另验 frontmatter；改 gatecheck.py 后须 --update-baseline 重算
    catch_by: quick_validate.py + scripts/verify.py（内含 selfcheck [1]/[1b]/[4] 与 compile_rules）+ 人工校对
    level: L1

  - id: E-028
    title: 合规疲劳型流水账与过度显式动作链
    history: 实际执行反馈：一章 3000 字，开写前注入规则超正文十倍；写每句同时跑拐链／占手／
             限频／钩位／破折号计数，戏剧注意力被审计占满。结果拆箱→分拣→摆桌→走动线等权重排列、
             逐次写全放拐链（单条都合规，合起来像器械说明书）；叙述层是中性报告腔，声口只活在对话里，
             身体细节准确但无态度。防错条款越密，正文越像合规演示。
    wrong: ❌ 把审计清单带进生成时点；核心受限自己当场景主题；段内动作句只靠「然后」相连；
           每次放取都写全链；叙述层零判断词；身体细节只写形态不写态度；靠加形容词救
    right: 写作时点只带三条正向目标，审计移到润色结构遍且覆盖不减；受限须打断读者已在乎的目标；
           权重审计（驻留/掠过/节拍，连续三段同权重即重写）＋链压缩（首次／打破／障碍才写全）；
           叙述层至少 1 处判断词/省略/反问；触发型 beat 填态度槽；修法从属化而非加装饰
    catch_by: 人工逐字校对（语义层）+ core/prose-craft.md 1.6/3.2/5.1-H/5.6 +
           core/chapter-planning.md#★核心受限的戏剧宿主 + S28/S29/S41 + 冷读维度 15/16
    level: L3

  - id: E-029
    title: 机检脚本端到端运行时回归（变量遮蔽／退出清理）
    history: 7.1.0 发布版 gatecheck.py 的状态机轨迹循环用 a, b 作循环变量，遮蔽了
             argparse 命名空间 a；全合规项目走到 PASS 前抛 AttributeError，退出码 1。
             静态校验（verify.py 16 项＋哈希基线＋语法编译）全绿却漏检，因为机检不执行脚本。
             同一发布的 --report 用 atexit 过早关闭报告文件，退出 flush 失败把退出码改成 120。
    wrong: ❌ 只跑静态检查／哈希基线／语法编译就发布；❌ 用单字母 a 作 argparse 命名空间；
           ❌ 把报告文件交给 atexit 直接 close 而不还原 sys.stdout
    right: 改 scripts/ 后必须端到端实跑四场景并断言退出码——
           ① 合规项目（轨迹 ≥2 态）→ PASS/0；② --precheck → PRECHECK 完成/0 且无 PASS 字样；
           ③ 不合规项目 → FAIL 清单/1；④ 无章节状态块的旧账本 → PASS/0；
           另核 --report UTF-8 落盘、全程零 Traceback。命名空间统一命名 args。
    catch_by: 端到端实跑（四场景退出码断言） + scripts/gatecheck.py 内防复发注释
    level: L1

  # ── v8.0.0 新增：文笔与声音层（前十版只测「有没有错」，不测「有没有劲」）──────
  - id: E-030
    title: 全章说明书腔（逐段等权重动作链）
    history: 实际产出：一章 2800 字，生理事实全对、禁项全零、机检 PASS，但读者反馈
             「像看康复流程记录」。症状：每段 2–3 句、句长接近、动作等权重排列、
             段末无判断，换任何角色都成立。
    wrong: ❌ 一段里「坐起来／拿拐／站起来／走到门口／开门」等权重排列；❌ 每段 2–3 句同长；
           ❌ 全章无一处只有这本书才有的具体（钱、数、只有这条街的规矩）
    right: 让一个前台欲望统领，其余从属化；每章至少一段概述；一场靠三件具体东西站住
           （物／数／原话或后果）；连续三段同权重即重写
    catch_by: core/scene-engine.md 二/三/七节 + gatecheck [19]（WARN）+ 冷读问5（哪段可整段删）
    level: L3

  - id: E-031
    title: 对话同一语域（五个人一个声音）
    history: 冷读问4 高发：主角、邻居、医生、孩子、同事的台词可以互换；
             都工整、都完整、都会讲道理。声口只剩五个标签（毒舌/寡言/絮叨…）没有落地法。
    wrong: ❌ 给每个角色配语气词当声口；❌ 所有角色都能说完整抒情句；
           ❌ 靠「说道/补充道/强调道」区分说话人
    right: 声音卡五项（句长／用词域／回避方式／玩笑方式／不肯承认的事）；
           每章过三问：盖名认人、温度切换一处、最紧张处台词变短；
           对话标签默认「说」并允许重复
    catch_by: core/voice.md 二/四/十一节 + templates/voice-card.md + 冷读问4
    level: L3

  - id: E-032
    title: 伪幽默（俏皮写成口癖与网络梗）
    history: 要求「角色俏皮」后，产出靠「绝绝子」「我裂开了」「哎哟喂」撑喜感；
             换一本 2020 年的书也成立，且三年后作废。
    wrong: ❌ 网络梗、方言尾音、口头禅当幽默；❌ 笑点后补一句解释；
           ❌ 拿残缺本身开玩笑（把她写成笑柄）
    right: 幽默六法（降格／一本正经说荒唐／错位回答／自嘲／过度精确／规律被打破）；
           一章一到两处，落在放松段落；自嘲须她先笑
    catch_by: core/voice.md#五、幽默六法与边界 + 人工校对
    level: L3

  - id: E-033
    title: 该严肃时俏皮（张力段塞笑点）
    history: 「幽默一点」被执行成全程幽默：危机段、受伤段、告别段都安排了一句俏皮话，
             张力被自己消掉。
    wrong: ❌ 紧张段落里安排笑点；❌ 她一开口就在硬撑，旁白还替她开玩笑；
           ❌ 危机段用比喻和抒情
    right: 严肃场三条（字越少／不解释／不加内心分析）；她自己还有余力才开玩笑；
           反差靠前后章，不靠同段
    catch_by: core/voice.md#六、严肃场面三条 + 冷读问6（哪句说得比戏大）
    level: L3

  - id: E-034
    title: 缺概述（时间走不动）
    history: 每章都逐场推进，起床到睡觉都写；三章过去故事只过了一天，
             读者感到「一直在原地」，节奏四病里的 Dragging 与 Rushing 同时出现。
    wrong: ❌ 全章场景化，无一段概述；❌ 用「然后」「接着」压缩时间；
           ❌ 把重复劳动（训练、通勤）逐日写
    right: 场景用于关键选择与不可撤回的动作；概述用于重复劳动与时间流逝，每章至少一段；
           概述给结果与代价，不给过程
    catch_by: core/scene-engine.md#三、场景与概述交替 + core/pacing.md 节奏四病
    level: L3

  - id: E-035
    title: 装饰性细节（细节不工作）
    history: 为「有画面感」加入凌晨三点、第三根烟、凉掉的咖啡、窗外的雨；
             删掉后判断、行动、关系一项没变。
    wrong: ❌ 无来源无后果的精确时间／天气／神态／摆设；❌ 每个场景开场都写环境
    right: 判据是删掉它，读者的判断／人物行动／两人关系有没有变化；没有就删；
           身体与器具细节不受此限，但须经态度过滤
    catch_by: core/scene-engine.md#六、细节必须工作 + 冷读问5
    level: L3

  - id: E-036
    title: 心动句公式化（八处示范 → 每章同构妙句）
    history: 旧版用「公式＋变量」教文学效果，结果每章都有同质地的妙句：
             物件＋一个不属于它的动词＋不解释，且一律留白收尾。单看都好，整本一个味。
    wrong: ❌ 从示范句提取公式后换变量批量生成；❌ 每章都要有一句「值得截图」的句子；
           ❌ 所有段末都留白
    right: 示范节收为三处且只学判断不学句子；先问「她此刻会怎么处理」再动笔；
           普通段落普通地结束
    catch_by: core/audience.md#四道闸门 + core/style.md#★三阶示范 + 冷读维度17
    level: L3

  - id: E-037
    title: 标点口径残留冲突（破折号配额 vs 零容忍）
    history: v7 及以前同时存在「破折号 ≤3/章」「分句式对比句 ≤1/章」与「一律禁」两种口径，
             示范句自己用破折号并注明「计配额」，等于教模型用满配额，实测一章 18 处。
    wrong: ❌ 叙述层用破折号造锐利感；❌ 用解释性冒号列举；❌ 叙述层写「不是X而是Y」
    right: 叙述层破折号 0／解释性冒号 0／翻案句 0；对话内保留（打断、拖长、翻案都合法）；
           引号统一「」
    catch_by: core/style.md#标点与句式三禁（叙述层） + gatecheck [18]-S42
    level: L2

  - id: E-038
    title: 冷读只看违规，不看读感
    history: 22 维全覆盖、判定全「通过」，交付后读者仍说「看不下去」——维度表查的是
             「有没有错」，读者感到的是「有没有劲」，两者不重叠。
    wrong: ❌ 冷读只出维度判定；❌ 读感七问用分数或形容词回答；
           ❌ 七问与维度冲突时以维度为准
    right: 六问先做且必答（引文或「没感觉」都算答）；六问与维度冲突时以六问为准；
           受理时六问缺行即退回
    catch_by: core/cold-review.md#〇 + gatecheck [7]（读感七问 7 行，仅 6 行 WARN）
    level: L3

  - id: E-039
    title: 审查层压死生成层（清单带进写作时点）
    history: v7 的 SKILL 注入索引把章末 38 项自查、配额表、钩子窗口全部排在「开写前」，
             模型动笔前已读完验收表，正文成为对表答辩；压缩后仍复发过一次。
    wrong: ❌ 开写前读 templates/chapter.md；❌ 写一段回头核一次 S 编号；
           ❌ 用「合规」替代「好看」作为过稿理由
    right: 写作时点只带写作卡＋声音卡＋硬层；审读时点才展开 12 组与七问；
           SKILL 明写「写作时点读 chapter.md 属顺序错误」
    catch_by: SKILL.md#★写作时点与审读时点 + 人工校对（注入清单核对）
    level: L3

  - id: E-040
    title: 机检给假阴性（翻案句报 0 处，冷读数出 5 处）
    history: 机检正则只认带「而是」的完整式，而中文最常见的翻案形态是逗号或句号断开的
             「不是X，是Y」「不是X。是Y」。同一份稿子冷读报 5 处、机检报 0 处，
             作者看到「0 处」以为干净了。假阴性比误报更危险。
    wrong: ❌ 用「不是X而是Y」这一种形态代表全部翻案句；❌ 看到机检报 0 就当合格；
           ❌ 把「她不是本地人，是南边来的」这类事实并列也一律判违规（会逼出别扭的改法）
    right: 机检须覆盖三种断法（而是式／逗号断开／句号断开）＋并非·不在于·与其说·看似四族；
           倒装式「X是A，不是B」单处可能是事实纠正，同章 ≥2 处才提示；
           机检报 0 与冷读报多冲突时，以冷读为准并回查正则
    catch_by: gatecheck [18]-S42（三条正则分支）+ 冷读维度 15 + 人工构造用例回扫
    level: L3

  - id: E-041
    title: 禁令标题窄于内容（凭标题判断必漏）
    history: 器具禁令标题叫「损耗与更换」，实际范围还含缠布、调校与任何人的议论。
             作者判定「缠布既不是损耗也不是更换，是维护」，于是写进正文——
             而它明列在禁止范围内。同类还有「调校」「关于它的台词与独白」。
    wrong: ❌ 凭禁令标题判断「我写的这项应该不禁」；❌ 只把枚举写进 YAML 注释
           （脚本重写一次就全丢）；❌ 冷读维度的列举比禁令本体少项
    right: 标题下面紧跟一行「本禁令实际含 X／Y／Z」的检索可见摘要；
           冷读维度的列举须与禁令本体逐项对齐；关键项加机检词表兜底（不靠人记）；
           枚举做成 YAML 数据块而非注释
    catch_by: core/audience.md#★器具损耗与更换禁令（范围摘要）+ cold-review 维度 6
              + gatecheck [23] 词表 + [25] 枚举表一致性
    level: L3

  - id: E-042
    title: 幻想向战斗冲突被写成非战斗冲突
    history: 登记为「对抗危机／主冲突线推进」的幻想向章，正文用对峙、协商、
             误会化解或一段「经过一番周旋」把交锋带过；机检全绿、配额也达标，
             读者却没看到任何一次真正的交手。
    wrong: ❌ 把已登记的战斗冲突定义成非战斗冲突（对峙/口角/协商/内心挣扎/制度摩擦/
           冷处理）；❌ 用「没有动手」「不战而屈人之兵」「最终没打起来」收场；
           ❌ 一两招结束或用概述代替交锋；❌ 降档、降回合数
    right: 真打（近身／兵器／魔法对轰三选一）＋有死有伤＋按 R-027 打足回合＋
           攻防转换与反打；冲突强度档与张力级取较严者；敌人按四阶升级不降智
    catch_by: genre/fantasy.md 第十一节（R-033 唯一权威）+ gatecheck [30] +
              templates/chapter.md G01/G07/G08 + cold-review 维度 9/10/21 + 双简报第三节
    level: L3

  - id: E-043
    title: 战斗过程复用与题材豁免越界
    history: 连续两场高魔战斗换了敌人与地名，但开局态势、攻防转换顺序、
             决胜招、伤亡后果四要素整组照搬；另一类是把幻想向主角光环带进现实向，
             或反过来用「无代价常驻／六类全开」把幻想向主角判成无障碍化。
    wrong: ❌ 近 5 章复用战斗过程四要素组合（同场景域换皮重打、「又一次／像上次」式简写）；
           ❌ 现实向出现主角光环／能力强化补偿／E1–E3 豁免；
           ❌ 幻想向仍按旧「六类全开＝无障碍化」判失真，或漏登记豁免四界；
           ❌ 把截肢写成力量来源（「失去腿换来神力」）
    right: 四要素逐章登记 `解法台账` 与 `情节事件登记`，事件层与招法层分判；
           幻想向按 R-032 解禁叙事层胜负约束，只守生理红线与豁免四界；
           现实向零豁免，两向互斥一书锁一个
    catch_by: genre/fantasy.md 第十／十一节 + genre/realistic.md 第六节 +
              gatecheck [30]/[31] + cold-review 维度 6/13/21 + 红队禁令类
    level: L3

  - id: E-044
    title: 沉默寡言被当成角色默认性格
    history: 设定阶段没问性格，AI 自动在人物卡写「性格：沉默寡言／冷漠」，
             五个角色共用同一套短句腔；读者盖住名字认不出谁在说话。
    wrong: ❌ 把「话少／冷漠／沉默寡言／高冷／冷淡」当默认性格或设定阶段默认取值；
           ❌ 代用户默认选声口标签「克制寡言」；❌ 无用户原话却落进账本 `性格`·`声口`
    right: 性格须来自用户选择；落上述词须溯源原话，否则改填声音卡五项可验证行为；
           四种合法用法（用户显式／场景态／冷角色技术术语／五声口之一）不误删
    catch_by: core/character-setup.md「★默认性格禁令」节（R-034 唯一权威）+
              gatecheck [31] + templates/chapter.md G10 + cold-review 读感问 4 +
              PLATFORM-CN.md 3-补 手工替代
    level: L3

# 优化目标（供 optimize_prompts.py 计算分层加权风险概览）
scoring:
  weights: {L0: 1.0, L1: 1.2, L2: 1.5, L3: 2.0}
  note: L3（语义/人工层）权重最高——它们是机检盲区，也是本技能读者最敏感的部分。
  baseline: 以 6.0.0 为基线；任何注入顺序调整后，**评测用例 L3 须由人工逐字校对裁决**。
            静态评分只给风险概览，❌ 不得代替人工、也不产出「命中率」结论。
